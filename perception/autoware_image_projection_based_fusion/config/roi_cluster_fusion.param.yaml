/**:
  ros__parameters:
    fusion_distance: 100.0
    strict_iou_fusion_distance: 100.0
    strict_iou_match_mode: "iou"
    rough_iou_match_mode: "iou_x"
    use_cluster_semantic_type: false
    only_allow_inside_cluster: true
    roi_scale_factor: 1.1
    iou_threshold:
      UNKNOWN : 0.1
      CAR : 0.65
      TRUCK : 0.65
      BUS : 0.65
      TRAILER : 0.65
      MOTORCYCLE : 0.65
      BICYCLE : 0.65
      PEDESTRIAN : 0.2
    remove_unknown: true
    size_validation:
      UNKNOWN:
        enable: false                    # Enable size validation for unknown objects
        min_length: 0.5                 # Minimum length in x direction [m]
        max_length: 10.0                # Maximum length in x direction [m]
        min_width: 0.5                  # Minimum width in y direction [m]
        max_width: 10.0                 # Maximum width in y direction [m]
        min_height: 0.2                 # Minimum height in z direction [m]
        max_height: 5.0                 # Maximum height in z direction [m]
      CAR:
        enable: false                    # Enable size validation for cars
        min_length: 0.0                 # Minimum length in x direction [m]
        max_length: 5.8                 # Maximum length in x direction [m]
        min_width: 1.2                  # Minimum width in y direction [m]
        max_width: 5.0                  # Maximum width in y direction [m]
        min_height: 0.5                 # Minimum height in z direction [m]
        max_height: 2.5                 # Maximum height in z direction [m]
      TRUCK:
        enable: false                    # Enable size validation for trucks
        min_length: 0.0                 # Minimum length in x direction [m]
        max_length: 18.0                # Maximum length in x direction [m]
        min_width: 1.5                  # Minimum width in y direction [m]
        max_width: 3.5                  # Maximum width in y direction [m]
        min_height: 0.5                 # Minimum height in z direction [m]
        max_height: 4.5                 # Maximum height in z direction [m]
      BUS:
        enable: false                    # Enable size validation for buses
        min_length: 0.0                 # Minimum length in x direction [m]
        max_length: 17.0                # Maximum length in x direction [m]
        min_width: 2.0                  # Minimum width in y direction [m]
        max_width: 3.2                  # Maximum width in y direction [m]
        min_height: 0.5                 # Minimum height in z direction [m]
        max_height: 4.5                 # Maximum height in z direction [m]
      TRAILER:
        enable: false                    # Enable size validation for trailers
        min_length: 0.0                 # Minimum length in x direction [m]
        max_length: 25.0                # Maximum length in x direction [m]
        min_width: 1.5                  # Minimum width in y direction [m]
        max_width: 3.2                  # Maximum width in y direction [m]
        min_height: 0.5                 # Minimum height in z direction [m]
        max_height: 4.5                 # Maximum height in z direction [m]
      MOTORCYCLE:
        enable: false                    # Enable size validation for motorcycles
        min_length: 1.0                 # Minimum length in x direction [m]
        max_length: 3.0                 # Maximum length in x direction [m]
        min_width: 0.5                  # Minimum width in y direction [m]
        max_width: 1.0                  # Maximum width in y direction [m]
        min_height: 0.5                 # Minimum height in z direction [m]
        max_height: 2.5                 # Maximum height in z direction [m]
      BICYCLE:
        enable: false                    # Enable size validation for bicycles
        min_length: 1.0                 # Minimum length in x direction [m]
        max_length: 3.0                 # Maximum length in x direction [m]
        min_width: 0.5                  # Minimum width in y direction [m]
        max_width: 1.0                  # Maximum width in y direction [m]
        min_height: 0.5                 # Minimum height in z direction [m]
        max_height: 2.5                 # Maximum height in z direction [m]
      PEDESTRIAN:
        enable: true                     # Enable size validation for pedestrians
        min_length: 0.5                 # Minimum length in x direction [m]
        max_length: 2.5                 # Maximum length in x direction [m]
        min_width: 0.3                  # Minimum width in y direction [m]
        max_width: 1.0                  # Maximum width in y direction [m]
        min_height: 0.2                 # Minimum height in z direction [m]
        max_height: 2.5                 # Maximum height in z direction [m]